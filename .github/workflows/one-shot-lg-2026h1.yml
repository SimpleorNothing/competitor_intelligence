name: One-shot LG 2026 H1 CI update

on:
  push:
    branches:
      - update/lg-2026h1-report-20260815
    paths:
      - .github/workflows/one-shot-lg-2026h1.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: update/lg-2026h1-report-20260815
          fetch-depth: 0

      - name: Update CI data from LG 2026 H1 report
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const strategiesPath = 'public/data/strategies.json';
          const evidencePath = 'public/data/evidence.json';
          const stamp = '2026-08-15T11:30:00+09:00';

          const s = JSON.parse(fs.readFileSync(strategiesPath, 'utf8'));
          s.updatedAt = stamp;
          const lg = s.companies.find(c => c.id === 'lg');
          if (!lg) throw new Error('LG company not found');
          if (lg.frame) lg.frame.lastVerified = '2026-08-15';

          function axis(id) {
            const a = lg.axes.find(x => x.id === id);
            if (!a) throw new Error('Axis not found: ' + id);
            return a;
          }
          function addKpi(a, text, marker) {
            if (!a.kpi.some(x => x.includes(marker))) a.kpi.push(text);
          }

          const a2 = axis('lg-a2');
          addKpi(a2,
            "'26 상반기 ES 매출 5조5,484억원·영업이익 4,843억원 (공시 · '26.8.14 반기보고서, YoY 매출 -2.6%·영업이익 -26.3%)",
            '5조5,484억원');
          addKpi(a2,
            "'26 반기보고서에서 칠러·CDU·공기냉각·액침냉각 등 AI 데이터센터 냉각 포트폴리오 실행을 재확인 (공시 · 평택 AI 데이터센터 테스트베드 기반 PoC 포함)",
            '반기보고서에서 칠러·CDU');
          a2.statusRationale = "AIDC 냉각 수주·CDU 인증·제품 포트폴리오 확대 등 실행 모멘텀은 가속 상태를 유지한다. 다만 '26 상반기 ES 매출 5조5,484억원(-2.6% YoY), 영업이익 4,843억원(-26.3%)으로 단기 실적은 약화됐다. 따라서 전략 실행 가속과 현재 손익을 분리 판정하며, 하반기 AIDC 수주가 매출·마진으로 전환되는지 확인한다.";
          a2.trajNote = "'24→'25 실적 성장 +5.7%가 20조 필요 CAGR 16.5%를 하회했고, '26 상반기 ES 매출도 5조5,484억원으로 YoY -2.6%. 정량 궤도는 여전히 하회하나 AIDC 수주·CDU·액침냉각 실행은 가속 — 신규 수주의 매출 전환이 핵심 검증 포인트.";

          const a4 = axis('lg-a4');
          addKpi(a4,
            "'26 상반기 HS 매출 14조188억원(+5.4% YoY)·영업이익 1조2,556억원(+16.1%) (공시 · '26.8.14 반기보고서)",
            '14조188억원');
          a4.statusRationale = "'25 하반기 고정비 재편과 '26.1Q 원가 개선에 이어 '26 상반기 HS 매출 14조188억원(+5.4%), 영업이익 1조2,556억원(+16.1%)으로 본업 이익창출력이 개선됐다. 프리미엄·볼륨존 투트랙과 원가·공급망 최적화 효과를 구조적 개선과 관세 환급 등 일회성 효과로 분리해 추적한다.";

          const a6 = axis('lg-a6');
          addKpi(a6,
            "'26.6 Bear Robotics가 Kinisi Industries Inc.·Ltd 지분 100% 인수·연결 편입. Kinisi 사업은 'Physical AI 및 실시간 인식 기술을 활용한 로봇 개발/판매'로 공시 (반기보고서)",
            'Kinisi Industries');
          a6.statusRationale = "CEO 직속 로보틱스사업센터, 데이터팩토리, 창원 액추에이터 파일럿 라인에 이어 Bear Robotics를 통한 Kinisi 100% 인수·연결 편입까지 확인됐다. Kinisi의 공시 사업내용이 Physical AI·실시간 인식 기반 로봇 개발/판매로 명시돼, LG 로봇 전략이 하드웨어 내재화에서 Physical AI 역량 확보로 확장되는 실행 증거가 추가됐다. 외부 수주·양산 매출은 여전히 미공표다.";

          fs.writeFileSync(strategiesPath, JSON.stringify(s, null, 2) + '\n');

          const e = JSON.parse(fs.readFileSync(evidencePath, 'utf8'));
          const ids = (e.items || []).map(x => Number(x.id)).filter(Number.isFinite);
          let nextId = (ids.length ? Math.max(...ids) : 0) + 1;
          function addEvidence(item, marker) {
            if ((e.items || []).some(x => String(x.event || '').includes(marker))) return;
            e.items.push({
              id: nextId++,
              companyId: 'lg',
              signalType: 'Deep',
              confidence: '사실',
              source: {
                name: 'LG전자 2026 반기보고서 (DART)',
                url: 'https://dart.fss.or.kr/',
                tier: 1
              },
              interpretationBy: 'chatgpt',
              reviewStatus: 'reviewed',
              ...item
            });
          }

          addEvidence({
            axisId: 'lg-a2',
            date: '2026-08-14',
            event: "2026 반기보고서에서 ES 상반기 매출 5조5,484억원, 영업이익 4,843억원을 공시. 전년 동기(매출 5조6,986억원·영업이익 6,572억원) 대비 각각 -2.6%, -26.3%. 동시에 칠러·CDU·공기냉각·액침냉각 등 AI 데이터센터 냉각 솔루션 실행 자료를 재확인.",
            interpretation: "AIDC 전략 실행은 가속되고 있지만 ES 전체 손익은 아직 성장 궤도에 올라오지 않았다는 공식 공시 근거. '전략 가속'과 '단기 실적 약화'를 분리해 추적해야 함."
          }, 'ES 상반기 매출 5조5,484억원');

          addEvidence({
            axisId: 'lg-a4',
            date: '2026-08-14',
            event: "2026 반기보고서에서 HS 상반기 매출 14조188억원, 영업이익 1조2,556억원을 공시. 전년 동기 대비 각각 +5.4%, +16.1%.",
            interpretation: "신사업 확대와 동시에 전통 가전 본업의 이익창출력이 개선되고 있음. LG의 사업 전환을 가전 본업 약화로 해석하기보다 캐시카우 강화와 신사업 투자의 병행 구조로 보는 근거."
          }, 'HS 상반기 매출 14조188억원');

          addEvidence({
            axisId: 'lg-a6',
            date: '2026-06',
            event: "Bear Robotics가 Kinisi Industries, Inc.와 Kinisi Industries Limited 지분 100%를 인수해 LG전자 연결대상에 편입. 반기보고서는 Kinisi의 사업을 'Physical AI 및 실시간 인식 기술을 활용한 로봇 개발/판매'로 기재.",
            interpretation: "Bear Robotics 인수가 서빙로봇 확대에 그치지 않고 Physical AI·실시간 인식 역량 확보 플랫폼으로 확장되는 증거. 홈로봇·휴머노이드 전략의 소프트웨어/인지 레이어 강화 신호."
          }, 'Kinisi Industries, Inc.와 Kinisi Industries Limited');

          e.updatedAt = stamp;
          fs.writeFileSync(evidencePath, JSON.stringify(e, null, 2) + '\n');
          NODE

      - name: Validate JSON and commit data only
        shell: bash
        run: |
          node -e "JSON.parse(require('fs').readFileSync('public/data/strategies.json')); JSON.parse(require('fs').readFileSync('public/data/evidence.json')); console.log('JSON OK')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/strategies.json public/data/evidence.json
          git rm .github/workflows/one-shot-lg-2026h1.yml
          git commit -m "data: LG 2026 반기보고서 전략·증거 반영"
          git push origin HEAD:update/lg-2026h1-report-20260815
